#### UNITS ####
# Common and less common, grouped by quantity.
# Conversion factors are exact (except when noted),
# although floating-point conversion may introduce inaccuracies

# Angle
turn = { value = "2 * π * radian", aliases = ["revolution", "cycle", "circle"] }
degree = { value = "π / 180 * radian", symbol = "deg", aliases = ["arcdeg", "arcdegree", "angular_degree"] }
arcminute = { value = "degree / 60", symbol = "arcmin", aliases = ["arc_minute", "angular_minute"] }
arcsecond = { value = "arcminute / 60", symbol = "arcsec", aliases = ["arc_second", "angular_second"] }
milliarcsecond = { value = "1e-3 * arcsecond", symbol = "mas" }
grade = { value = "π / 200 * radian", symbol = "grad", aliases = ["gon", "gradian"] }
mil = { value = "π / 3200 * radian" }                                                                        # 6400 per turn

# Solid angle
steradian = { value = "radian ** 2", symbol = "sr" }
square_degree = { value = "(π / 180) ** 2 * sr", symbol = "sq_deg", aliases = ["sqdeg"] }

# Information
baud = { value = "bit / second", symbol = "Bd", aliases = ["bps"] }

byte = { value = "8 * bit", symbol = "B", aliases = ["octet"] }
# byte = 8 * bit = _ = octet
## NOTE: B (byte) symbol can conflict with Bell

# Dimensionless ratios
percent = { value = "0.01", symbol = "%" }
permille = { value = "0.001", symbol = "‰" }            # NOTE: ‰ = U+2030 (PER MILLE SIGN)
ppm = { value = "1e-6" }
strain = { value = "1", symbol = "ε", aliases = ["ϵ"] } # NOTE: ε = U+03B5 (GREEK SMALL LETTER EPSILON), ϵ = U+03F5 (GREEK LUNATE EPSILON SYMBOL)

# Length
angstrom = { value = "1e-10 * meter", symbol = "Å", aliases = ["ångström", "Å"] }
micron = { value = "micrometer", symbol = "μ", aliases = ["µ"] }
fermi = { value = "femtometer", symbol = "fm" }
light_year = { value = "speed_of_light * julian_year", symbol = "ly", aliases = ["lightyear"] }
astronomical_unit = { value = "149597870700 * meter", symbol = "au" }                                                                 # since Aug 2012
parsec = { value = "1 / tansec * astronomical_unit", symbol = "pc" }
nautical_mile = { value = "1852 * meter", symbol = "nmi" }
bohr = { value = "hbar / (alpha * m_e * c)", symbol = "a_0", aliases = ["a0", "bohr_radius", "atomic_unit_of_length", "a_u_length"] }
planck_length = { value = "(hbar * gravitational_constant / c ** 3) ** 0.5" }

# Mass
metric_ton = { value = "1e3 * kilogram", symbol = "t", aliases = ["tonne"] }
unified_atomic_mass_unit = { value = "atomic_mass_constant", symbol = "u", aliases = ["amu"] }
dalton = { value = "atomic_mass_constant", symbol = "Da" }
grain = { value = "64.79891 * milligram", symbol = "gr" }
gamma_mass = { value = "microgram" }
carat = { value = "200 * milligram", symbol = "ct" }
planck_mass = { value = "(hbar * c / gravitational_constant) ** 0.5" }

# Time
minute = { value = "60 * second", symbol = "min" }
hour = { value = "60 * minute", symbol = "h", aliases = ["hr"] }
day = { value = "24 * hour", symbol = "d" }
week = { value = "7 * day" }
fortnight = { value = "2 * week" }
year = { value = "365.25 * day", symbol = "a", aliases = ["yr", "julian_year"] }
month = { value = "year / 12" }

# decade = 10 * year
## NOTE: decade [time] can conflict with decade [dimensionless]

century = { value = "100 * year", aliases = ["centuries"] }
millennium = { value = "1e3 * year", aliases = ["millennia"] }
eon = { value = "1e9 * year" }
shake = { value = "1e-8 * second" }
svedberg = { value = "1e-13 * second" }
