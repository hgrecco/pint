version: 2
build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  apt_packages:
    - graphviz
  jobs:
    build:
      html:
        # Same command as the `docbuild` pixi task in pyproject.toml, so RTD
        # builds the docs the same way as local development.
        - sphinx-build -n -j auto -b html -d $READTHEDOCS_OUTPUT/doctrees docs $READTHEDOCS_OUTPUT/html
python:
   install:
     - method: pip
       path: .
       extra_requirements:
         - docs
