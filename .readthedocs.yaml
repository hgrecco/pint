version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    # https://docs.readthedocs.com/platform/stable/build-customization.html
    create_environment:
      - asdf plugin add pixi
      - asdf install pixi latest
      - asdf global pixi latest
    install:
      - pixi install -e docs
    build:
      html:
        - pixi run -e docs docbuild $READTHEDOCS_OUTPUT/html
